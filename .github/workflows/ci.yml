name: Runnable submission

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Check source snapshot and delivery files
        run: python scripts/verify_repository.py
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Run the complete test suite
        run: python -m pytest -q
      - name: Exercise every method and checkpoint roundtrip
        run: python scripts/smoke_test.py --out outputs/ci-smoke.json
      - name: Reproduce public result tables and figures
        run: python analysis/reproduce_results.py --out-dir outputs/ci-reproduced
      - name: Verify recorded historical source hashes
        run: python analysis/audit_training_evidence.py --out outputs/ci-source-audit.json
