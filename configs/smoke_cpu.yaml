# Short integration run on the real fixed split; never a formal experiment.
experiment:
  name: "smoke"
  seed: 42
data:
  root: "data/cifar100"
  split_dir: "data/splits"
  batch_size: 4
  num_workers: 0
model:
  name: "cifar_resnet18"
  num_classes: 100
training:
  epochs: 1
  optimizer: "sgd"
  learning_rate: 0.1
  momentum: 0.9
  weight_decay: 0.0005
  scheduler: "cosine"
augmentation:
  policy: "seam_dp"
  alpha: 1.0
  p: 1.0
  k: 4
  gamma: 0.5
  beta: 1.0
  seam_radius: 2
  seam_mu: 0.05
  seam_min_width: 2
  seam_area_budget: 0.2
  seam_random_mu: 0.225
output:
  checkpoint_dir: "checkpoints"
  log_dir: "logs"
